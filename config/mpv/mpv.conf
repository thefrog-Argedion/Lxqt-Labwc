##################
#sub-visability=no  #<----[ disable subtitles renable only for movies
sub-visibility=yes
sid=1
sub-auto=fuzzy
sub-file-paths=subtitles
# Display English subtitles if available.
slang=en

# Play Finnish audio if available, fall back to English otherwise.
alang=en

#resize window to video size?
auto-window-resize=no

#default screen? this doesn't work when ever I maximize its taking both screens.on the primary but if I play on secondary it does not.
#screen=0
#geometry=1920x1080+0+0

#save the place of the current video if stopped
save-position-on-quit

screenshot-directory=/home/thefrog/tmp/Pictures/mpv/
screenshot-format=png

# Pretend to be a web browser. Might fix playback with some streaming sites,
# but also will break with shoutcast streams.
#user-agent="Mozilla/5.0"
