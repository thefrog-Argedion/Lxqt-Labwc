
MBTN_LEFT     cycle pause              # toggle pause/playback mode
MBTN_LEFT_DBL ignore     # don't do anything
MBTN_RIGHT_DBL cycle fullscreen    # toggle fullscreen 
MBTN_RIGHT    ignore     # don't do anything    
#MBTN_MID      script-binding positioning/align-to-cursor # pan the whole video
#MBTN_BACK     playlist-prev       # skip to the previous file
#MBTN_FORWARD  playlist-next       # skip to the next file
#Ctrl+MBTN_LEFT script-binding positioning/drag-to-pan # pan around the clicked point

# Mouse wheels, touchpad or other input devices that have axes
# if the input devices supports precise scrolling it will also scale the
# numeric value accordingly
WHEEL_UP      add volume 5
WHEEL_DOWN    add volume -5
#WHEEL_LEFT    seek -10         # seek 10 seconds backward
#WHEEL_RIGHT   seek 10          # seek 10 seconds forward
