# bluetooth_battery devices.conf
# Format (one device per line):
#   NAME|MAC_ADDRESS|SHORTCUT|TYPE
#
# TYPE is optional (keyboard, mouse, headphones, etc.) – purely informational
# SHORTCUT is used on the command line, e.g.  bluetooth_battery.sh k
#
# Lines starting with # are ignored

